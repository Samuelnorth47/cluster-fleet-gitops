# Core CAPI Provider
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
spec:
  version: v1.13.2 # Change this to upgrade CAPI
---
# Proxmox Infrastructure Provider
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: proxmox
  namespace: capmox-system
  labels:
      clusterctl.cluster.x-k8s.io: ""
      cluster.x-k8s.io/provider: "infrastructure-proxmox"
spec:
  version: v0.8.1
  configSecret:
      name: proxmox-credentials     # Your actual secret name in default
      namespace: default
---
# Talos Bootstrap Provider
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: BootstrapProvider
metadata:
  name: talos
  namespace: cabpt-system
spec:
  version: v0.7.0-alpha.2