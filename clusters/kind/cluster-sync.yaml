apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./base/infrastructure/certmanager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-operator
  namespace: flux-system
spec:
  interval: 15m
  dependsOn:
    - name: cert-manager
  path: ./base/infrastructure/capi-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi
  namespace: flux-system
spec:
  interval: 15m
  dependsOn:
    - name: capi-operator
  path: ./base/infrastructure/capi-providers/capi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-capbt-capcp
  namespace: flux-system
spec:
  interval: 15m
  dependsOn:
    - name: capi
  path: ./base/infrastructure/capi-providers/capbtcapcp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ipam
  namespace: flux-system
spec:
  interval: 15m
  dependsOn:
    - name: capi-capbt-capcp
  path: ./base/infrastructure/capi-providers/ipam
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-capmox
  namespace: flux-system
spec:
  interval: 15m
  dependsOn:
    - name: ipam
  path: ./base/infrastructure/capi-providers/capmox
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: caaph
  namespace: flux-system
spec:
  interval: 15m
  dependsOn:
    - name: capi-capmox
  path: ./base/infrastructure/capi-providers/caaph
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: admin-capi-manifests
  namespace: flux-system
spec:
  interval: 15m
  dependsOn:
    - name: caaph
  path: ./clusters/kind/admin-capi-manifests
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
