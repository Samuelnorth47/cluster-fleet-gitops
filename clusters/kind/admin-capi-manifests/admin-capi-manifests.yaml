apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  labels:
    cluster.x-k8s.io/cluster-name: capi-quickstart
    bootstrap: "true"
  name: capi-quickstart
  namespace: capi-system
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 10.244.0.0/16
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: TalosControlPlane
    name: capi-quickstart-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ProxmoxCluster
    name: capi-quickstart
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxCluster
metadata:
  name: capi-quickstart
  namespace: capmox-system
spec:
  credentialsRef:
    name: proxmox-credentials
  allowedNodes:
  - mercury
  - venus
  - saturn
  - neptune
  - pluto
  controlPlaneEndpoint:
    host: api.capi-quickstart.northcloud.dev
    port: 6443
  dnsServers:
  - 192.168.20.1
  - 192.168.4.1
  ipv4Config:
    addresses:
    - 192.168.20.100-192.168.20.110
    gateway: 192.168.20.1
    prefix: 24
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha3 
kind: TalosControlPlane
metadata:
  name: capi-quickstart-control-plane
  namespace: capcp-system
spec:
  replicas: 3
  version: v1.36.0
  infrastructureTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
    kind: ProxmoxMachineTemplate
    name: capi-quickstart-control-plane
  controlPlaneConfig:
    controlplane:
      generateType: controlplane
      talosVersion: v1.13.3
      strategicPatches:
        - |
          machine:
            kubelet:
              extraArgs:
                cloud-provider: external
                rotate-server-certificates: "true"
            features:
              kubernetesTalosAPIAccess:
                enabled: true
                allowedRoles:
                  - os:reader
                allowedKubernetesNamespaces:
                  - kube-system
            install:
              disk: /dev/sda
              extraKernelArgs:
                - net.ifnames=0
              extensions:
                - image: ghcr.io/siderolabs/qemu-guest-agent:11.0.0
            network:
              cni:
                name: none
              proxy:
                disabled: true
              interfaces:
                - interface: eth0
                  dhcp: false
                  vip:
                    ip: 192.168.20.32
            certSANs:
                - 192.168.20.32
                - api.capi-quickstart.northcloud.dev
          cluster:
            externalCloudProvider:
              enabled: true
              manifests:
                - https://raw.githubusercontent.com/siderolabs/talos-cloud-controller-manager/main/docs/deploy/cloud-controller-manager.yml
                - https://raw.githubusercontent.com/alex1989hu/kubelet-serving-cert-approver/main/deploy/standalone-install.yaml
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: capi-quickstart-control-plane
  namespace: capmox-system
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 20
      format: qcow2
      full: true
      memoryMiB: 4096
      network:
        networkDevices:
        - bridge: vmbr0
          model: virtio
          name: net0
      numCores: 2
      numSockets: 1
      sourceNode: mercury
      templateID: 1001
      checks:
        skipCloudInitStatus: true
        skipQemuGuestAgent: true
      metadataSettings:
        providerIDInjection: true
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: capi-quickstart-worker
  namespace: capmox-system
spec:
  template:
    spec:
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 20
      format: qcow2
      full: true
      memoryMiB: 4096
      network:
        networkDevices:
        - bridge: vmbr0
          model: virtio
          name: net0
      numCores: 2
      numSockets: 1
      sourceNode: mercury
      templateID: 1001
      checks:
        skipCloudInitStatus: true
        skipQemuGuestAgent: true
      metadataSettings:
        providerIDInjection: true
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: capi-quickstart-workers
  namespace: capi-system
spec:
  clusterName: capi-quickstart
  replicas: 1
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: capi-quickstart
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: capi-quickstart
    spec:
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: TalosConfigTemplate
          name: capi-quickstart-worker
      clusterName: capi-quickstart
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: capi-quickstart-worker
      version: v1.36.0
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1 
kind: TalosConfigTemplate
metadata:
  name: capi-quickstart-worker
  namespace: capi-system
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.13.3
      strategicPatches:
        - |
          machine:
            install:
              disk: /dev/sda
            kubelet:
              extraArgs:
                cloud-provider: external
            network:
              cni:
                name: none
              proxy:
                disabled: true